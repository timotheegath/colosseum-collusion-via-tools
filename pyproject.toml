[project]
name = "colosseum"
version = "0.1.0"
description = "Colosseum experiments built on Terrarium"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "terrarium-agents[providers,science,plots]",
  "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
vllm = ["terrarium-agents[vllm]"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

[tool.uv.sources]
terrarium-agents = { path = "external/Terrarium", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
