[project]
name = "colosseum"
version = "0.1.0"
description = "Colosseum experiments built on Terrarium"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "terrarium-agents[providers,science,plots]==0.2.1",
  "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
vllm = ["terrarium-agents[vllm]==0.2.1"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

# This repo is not an installable package (run.py adds the repo root to
# sys.path itself); declaring it virtual keeps `uv sync`/`uv run` from
# trying to build it with setuptools, which fails on the flat layout.
[tool.uv]
package = false

[tool.uv.sources]
terrarium-agents = { path = "external/Terrarium", editable = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
